spring:
  application:
    name: booking-service
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hoteldb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,https://hotel-booking-system-production-1eab.up.railway.app}
  hotel-service:
    url: ${HOTEL_SERVICE_URL:http://localhost:8081/api/v1}
  notifications:
    webhook-url: ${NOTIFICATION_WEBHOOK_URL:}
  queue:
    new-reservations: new-reservations
