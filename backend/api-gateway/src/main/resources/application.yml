spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      
      routes:
        - id: hotel-service
          uri: ${HOTEL_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/hotels/**, /api/v1/rooms/**, /api/v1/availability/**, /api/v1/admin/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}
        
        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/search/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}
        
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}
        
        - id: comment-service
          uri: ${COMMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}
        
        - id: ai-agent-service
          uri: ${AI_AGENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - RewritePath=/api/v1/ai/(?<segment>.*), /api/v1/$\{segment}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
