spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${ALLOWED_ORIGINS:https://hotel-booking-system-production-1eab.up.railway.app}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

      routes:
        - id: hotel-service
          uri: https://hotel-booking-system-production-b701.up.railway.app
          predicates:
            - Path=/api/v1/hotels/**, /api/v1/rooms/**, /api/v1/availability/**, /api/v1/admin/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}

        - id: search-service
          uri: https://hotel-booking-system-production-4e37.up.railway.app
          predicates:
            - Path=/api/v1/search/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}

        - id: booking-service
          uri: https://hotel-booking-system-production-b8ec.up.railway.app
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}

        - id: comment-service
          uri: https://hotel-booking-system-production-8c66.up.railway.app
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}

        - id: ai-agent-service
          uri: https://hotel-booking-system-production-c7da.up.railway.app
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - RewritePath=/api/v1/ai/(?<segment>.*), /api/v1/$\{segment}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
